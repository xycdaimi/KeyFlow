name: keyflow

services:
  keyflow-postgres:
    container_name: keyflow-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: keyflow
      POSTGRES_USER: keyflow
      POSTGRES_PASSWORD: keyflow
    ports:
      - "5432:5432"
    volumes:
      - keyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyflow -d keyflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keyflow-network

volumes:
  keyflow-postgres-data:

networks:
  keyflow-network:
    driver: bridge
