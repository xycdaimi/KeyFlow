name: keyflow

services:
  keyflow-api:
    container_name: keyflow-api
    build:
      context: ../..
      dockerfile: docker/src/Dockerfile
    command:
      [
        "sh",
        "-c",
        "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --app-dir src --workers ${UVICORN_WORKERS:-1}",
      ]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL_READ: ${DATABASE_URL_READ:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      DATABASE_URL_WRITE: ${DATABASE_URL_WRITE:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      REDIS_URL: ${REDIS_URL:-redis://keyflow-redis:6379/0}
    volumes:
      - ../../${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:/app/${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:ro
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    networks:
      - keyflow-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('PORT','8000'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  keyflow-worker:
    container_name: keyflow-worker
    build:
      context: ../..
      dockerfile: docker/src/Dockerfile
    depends_on:
      keyflow-api:
        condition: service_healthy
    command: ["python", "src/worker_main.py"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL_READ: ${DATABASE_URL_READ:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      DATABASE_URL_WRITE: ${DATABASE_URL_WRITE:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      REDIS_URL: ${REDIS_URL:-redis://keyflow-redis:6379/0}
    volumes:
      - ../../${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:/app/${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:ro
    networks:
      - keyflow-network

networks:
  keyflow-network:
    driver: bridge
