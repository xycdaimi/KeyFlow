# VIP 密钥池：与 docker/src 共用同一 PostgreSQL / Redis（容器名 keyflow-postgres、keyflow-redis）。
# 须与基础栈在同一 Docker 网络：先启动 docker/postgresql、docker/redis（及可选 docker/src），
# 其 project name 为 keyflow 时会创建网络 keyflow_keyflow-network；本文件通过 external 加入该网络。
name: keyflow

services:
  keyflow-vip-api:
    container_name: keyflow-vip-api
    build:
      context: ../..
      dockerfile: docker/vip/Dockerfile
    command:
      [
        "sh",
        "-c",
        "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --app-dir src --workers ${UVICORN_WORKERS:-1}",
      ]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL_READ: ${DATABASE_URL_READ:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      DATABASE_URL_WRITE: ${DATABASE_URL_WRITE:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      REDIS_URL: ${REDIS_URL:-redis://keyflow-redis:6379/0}
    volumes:
      - ../../${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:/app/${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:ro
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    networks:
      - keyflow-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('PORT','8001'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  keyflow-vip-worker:
    container_name: keyflow-vip-worker
    build:
      context: ../..
      dockerfile: docker/vip/Dockerfile
    depends_on:
      keyflow-vip-api:
        condition: service_healthy
    command: ["python", "src/worker_main.py"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL_READ: ${DATABASE_URL_READ:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      DATABASE_URL_WRITE: ${DATABASE_URL_WRITE:-postgresql+asyncpg://keyflow:keyflow@keyflow-postgres:5432/keyflow}
      REDIS_URL: ${REDIS_URL:-redis://keyflow-redis:6379/0}
    volumes:
      - ../../${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:/app/${MODEL_ALIAS_CONFIG_PATH:-config/model_aliases.yaml}:ro
    networks:
      - keyflow-network

networks:
  keyflow-network:
    driver: bridge
